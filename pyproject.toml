[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_factory"
version = "0.1.0"
description = "A generic factory for generating and running AI agent workforces from config-driven role charts."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Core: the `web_fetch` tool ships in default tool grants and needs `requests`
    # at runtime; the Ollama adapter uses it too (see the `ollama` extra).
    "requests>=2.0",
]

[project.scripts]
agent_factory = "agent_factory.cli:main"

[project.optional-dependencies]
# Runtime providers. OpenAI is the default (per user choice); Ollama covers
# local Gemma/Qwen; 'fake' is built-in and needs nothing.
openai = ["openai>=1.0"]
ollama = ["requests>=2.0"]
anthropic = ["anthropic>=0.30"]  # future adapter slot
# Local development / CI tools
dev = ["ruff>=0.8,<0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_factory" = ["templates/**/*.md"]

[tool.ruff]
# Keep local `ruff check` behavior identical to CI (see .github/workflows/ci.yml).
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, W: pycodestyle warnings,
# I: isort, B: flake8-bugbear, UP: pyupgrade, SIM: flake8-simplify, C4: comprehensions.
# E501 (line length) is intentionally NOT enforced: long docstrings/README blocks
# and generated prompt text are idiomatic here; flagging them adds noise without value.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]