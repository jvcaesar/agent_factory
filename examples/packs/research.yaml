domains:
  - research
  - data
  - product
  - partnerships
tools:
  - web
  - notion
  - docs
  - sheets
  - files
  - github
  - analytics
risk_tier: review_external
budget_tier: medium
add_amplifier: true
add_observer: true
use_lead: true